name: Terraform PR

on:
  pull_request:
    paths:
      - "envs/**"
      - "modules/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan-dev:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: envs/dev

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Verifier le format
        run: terraform fmt -check -recursive
        working-directory: .

      - name: Configurer AWS avec OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Initialiser Terraform
        run: terraform init -input=false

      - name: Valider Terraform
        run: terraform validate

      - name: Generer le plan
        id: plan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          set +e
          terraform plan -no-color -input=false > plan.txt 2>&1
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commenter la pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'envs/dev/plan.txt';
            const fullPlan = fs.readFileSync(path, 'utf8');
            const plan = fullPlan.match(/^Plan:.*$/m)?.[0] || 'Plan indisponible ou en erreur';
            const code = '${{ steps.plan.outputs.exitcode }}';
            const status = code === '0' ? 'Reussi' : 'Echec';
            const body = `### Terraform DEV - ${status}

            <details><summary>Afficher le plan</summary>

            \`\`\`text
            ${plan.slice(0, 55000)}
            \`\`\`

            </details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Verifier le resultat du plan
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

